name: CI

on:
  push:
    branches: [ "main", "feature/**", "chore/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -la

      - name: Basic project check
        run: |
          echo "Running CI for CampusEats Task Tracker"
          test -f README.md && echo "README found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (syntax check) and run the source
        run: |
          node --check src/tasks.js
          node src/tasks.js
